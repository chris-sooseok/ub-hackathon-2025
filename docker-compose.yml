name: vendme

services:
  # database container
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Flask backend container
  server:
    build:
      context: .
      dockerfile: server.Dockerfile
    env_file: ./.env
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MEDIA_ROOT=/data/media
    volumes:
      - server_media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5500/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  # React production build served by Nginx
  client:
    build:
      context: .
      dockerfile: client.Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Creating and naming volumes
volumes:
  mongodata:
  server_media:
